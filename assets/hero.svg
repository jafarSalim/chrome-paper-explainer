<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3b0764" flood-opacity="0.25"/></filter>
    <linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.6" stop-color="#db2777"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#c4b5fd" stop-opacity="0.25"/><stop offset="0.5" stop-color="#67e8f9" stop-opacity="0.6"/><stop offset="1" stop-color="#f9a8d4" stop-opacity="0.25"/></linearGradient>
    <clipPath id="cardclip"><rect x="610" y="150" width="540" height="330" rx="24"/></clipPath>
  </defs>

  <rect width="1200" height="540" fill="#f5f3ff"/>
  <!-- moving colour blobs behind the glass -->
  <g filter="url(#blur)">
    <circle r="190" fill="#a78bfa"><animateMotion dur="16s" repeatCount="indefinite" begin="-3s" path="M180,120 C320,60 420,260 260,330 C120,390 60,200 180,120"/></circle>
    <circle r="170" fill="#67e8f9"><animateMotion dur="19s" repeatCount="indefinite" begin="-8s" path="M1000,140 C1120,240 980,380 860,300 C760,230 880,60 1000,140"/></circle>
    <circle r="160" fill="#f9a8d4"><animateMotion dur="14s" repeatCount="indefinite" begin="-5s" path="M640,470 C760,420 820,520 700,560 C600,590 540,500 640,470"/></circle>
  </g>

  <!-- browser window -->
  <g filter="url(#sh)"><rect x="40" y="40" width="760" height="460" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.9"/></g>
  <circle cx="68" cy="66" r="6" fill="#ff5f57"/><circle cx="88" cy="66" r="6" fill="#febc2e"/><circle cx="108" cy="66" r="6" fill="#28c840"/>
  <rect x="136" y="54" width="520" height="26" rx="13" fill="#ffffff" fill-opacity="0.75"/>
  <text x="152" y="72" font-size="13" fill="#6b6785">🔒 arxiv.org/html/2611.00001v1</text>
  <rect x="676" y="54" width="100" height="26" rx="13" fill="url(#brand)"/>
  <text x="726" y="72" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="600">✦ Explainer</text>

  <!-- the paper -->
  <g font-family="'Latin Modern Roman','STIX Two Text',Georgia,serif" fill="#1e1b2e">
    <text x="90" y="124" font-size="22" font-weight="700">2  System Model</text>
    <g fill="#c9c3d9"><rect x="90" y="142" width="660" height="9" rx="4"/><rect x="90" y="160" width="610" height="9" rx="4"/><rect x="90" y="178" width="420" height="9" rx="4"/></g>
    <!-- equation -->
    <rect x="100" y="200" width="500" height="78" rx="14" fill="#ede9fe" fill-opacity="0">
      <animate attributeName="fill-opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.08;0.12;0.95;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="248" font-size="26" font-style="italic">H<tspan font-size="15" dy="7" font-style="normal">LOS</tspan><tspan dy="-7"> = </tspan></text>
    <text x="241" y="232" font-size="21" font-style="italic">(m+1)A</text>
    <line x1="235" y1="241" x2="325" y2="241" stroke="#1e1b2e" stroke-width="1.5"/>
    <text x="250" y="266" font-size="21" font-style="italic">2πd<tspan font-size="13" dy="-9">2</tspan></text>
    <text x="333" y="249" font-size="24"><tspan>cos</tspan><tspan font-size="14" dy="-11" font-style="italic">m</tspan><tspan dy="11" font-style="italic">(φ) T<tspan font-size="14" dy="6">s</tspan><tspan dy="-6"> g(ψ) cos(ψ)</tspan></tspan></text>
    
    <g fill="#c9c3d9"><rect x="90" y="300" width="660" height="9" rx="4"/><rect x="90" y="318" width="640" height="9" rx="4"/><rect x="90" y="336" width="520" height="9" rx="4"/>
      <rect x="90" y="372" width="660" height="9" rx="4"/><rect x="90" y="390" width="600" height="9" rx="4"/><rect x="90" y="408" width="660" height="9" rx="4"/><rect x="90" y="426" width="350" height="9" rx="4"/></g>
  </g>

  <!-- explain pill and cursor -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.11;0.24;0.27;1" dur="12s" repeatCount="indefinite"/>
    <rect x="440" y="160" width="112" height="32" rx="16" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="496" y="181" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4c1d95"><tspan fill="#db2777">✦</tspan> Explain</text>
  </g>
  <path d="M0,0 L0,18 L5,13 L9,21 L12,20 L8,12 L14,12 Z" fill="#1e1b2e" stroke="#fff" stroke-width="1.2">
    <animateMotion dur="12s" repeatCount="indefinite" keyTimes="0;0.1;0.2;0.25;1" keyPoints="0;0.55;1;1;1" calcMode="linear" path="M300,430 C380,330 450,230 492,180"/>
  </path>

  <!-- glass answer card -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.29;0.96;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,18;0,18;0,0;0,0" keyTimes="0;0.25;0.3;1" dur="12s" repeatCount="indefinite"/>
    <g filter="url(#sh)"><rect x="610" y="150" width="540" height="330" rx="24" fill="url(#glass)" stroke="#ffffff"/></g>
    <g clip-path="url(#cardclip)" opacity="0.55">
      <circle cx="1120" cy="160" r="110" fill="#c4b5fd" filter="url(#blur)"/>
      <circle cx="640" cy="470" r="100" fill="#a5f3fc" filter="url(#blur)"/>
    </g>
    <rect x="636" y="174" width="104" height="24" rx="12" fill="url(#brand)"/>
    <text x="688" y="191" text-anchor="middle" font-size="11.5" font-weight="800" fill="#fff" letter-spacing="1.2">EQUATION</text>
    <text x="752" y="191" font-size="15" font-weight="700" fill="#5b21b6">(1)</text>
    <!-- language toggle -->
    <rect x="1018" y="172" width="108" height="28" rx="14" fill="#ffffff" fill-opacity="0.7" stroke="#ddd6fe"/>
    <rect x="1021" y="175" width="50" height="22" rx="11" fill="#7c3aed">
      <animate attributeName="x" values="1021;1021;1073;1073;1021" keyTimes="0;0.62;0.66;0.95;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="1046" y="191" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">EN<animate attributeName="fill" values="#fff;#fff;#6b6785;#6b6785;#fff" keyTimes="0;0.62;0.66;0.95;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="1098" y="191" text-anchor="middle" font-size="12" font-weight="700" fill="#6b6785">عربي<animate attributeName="fill" values="#6b6785;#6b6785;#fff;#fff;#6b6785" keyTimes="0;0.62;0.66;0.95;1" dur="12s" repeatCount="indefinite"/></text>

    <!-- English answer -->
    <g font-size="14.5" fill="#1e1b2e">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.62;0.64;0.97;1" dur="12s" repeatCount="indefinite"/>
      <text x="636" y="232"><tspan font-weight="700" fill="#4c1d95">Line-of-sight channel gain</tspan>: the share of the LED's</text>
      <text x="636" y="254">light that reaches the photodiode directly.</text>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.36;0.39;1" dur="12s" repeatCount="indefinite"/>
        <text x="646" y="288">•  <tspan font-style="italic" font-family="Georgia,serif">m</tspan>  Lambertian order of the LED</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.40;0.43;1" dur="12s" repeatCount="indefinite"/>
        <text x="646" y="314">•  <tspan font-style="italic" font-family="Georgia,serif">A, d</tspan>  detector area, distance: gain ∝ 1/<tspan font-style="italic" font-family="Georgia,serif">d</tspan>²</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.47;1" dur="12s" repeatCount="indefinite"/>
        <text x="646" y="340">•  <tspan font-style="italic" font-family="Georgia,serif">φ, ψ</tspan>  emission and incidence angles</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.51;1" dur="12s" repeatCount="indefinite"/>
        <text x="636" y="374"><tspan font-weight="700" fill="#4c1d95">Intuition:</tspan> move the receiver away or off-axis</text>
        <text x="636" y="396">and the gain drops, so the SNR changes across the room.</text></g>
    </g>
    <!-- Arabic answer -->
    <g font-size="15.5" fill="#1e1b2e" direction="rtl" unicode-bidi="embed" text-anchor="start" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.67;0.95;1" dur="12s" repeatCount="indefinite"/>
      <text x="1124" y="234"><tspan font-weight="700" fill="#4c1d95">كسب القناة في خط النظر المباشر</tspan>: نسبة الضوء</text>
      <text x="1124" y="258">التي تصل من المصدر إلى الكاشف مباشرة.</text>
      <text x="1124" y="292">• رتبة لامبرت للمصدر <tspan font-style="italic" font-family="Georgia,serif">m</tspan></text>
      <text x="1124" y="318">• مساحة الكاشف والمسافة: يتناقص الكسب مع <tspan font-family="Georgia,serif">⁦1/d²⁩</tspan></text>
      <text x="1124" y="344">• زاويتا الإشعاع والسقوط <tspan font-family="Georgia,serif" font-style="italic">φ, ψ</tspan></text>
      <text x="1124" y="378"><tspan font-weight="700" fill="#4c1d95">الفكرة:</tspan> كلما ابتعد المستقبِل قلّ الكسب وتغيرت</text>
      <text x="1124" y="400">نسبة الإشارة إلى الضوضاء داخل الغرفة.</text>
    </g>
    <!-- loading shimmer before the answer -->
    <rect x="636" y="222" width="480" height="12" rx="6" fill="url(#shine)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.28;0.29;0.33;1" dur="12s" repeatCount="indefinite"/></rect>
    <line x1="636" y1="430" x2="1124" y2="430" stroke="#ddd6fe"/>
    <text x="636" y="456" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#6b6785">sonnet-5-5 · paper cached · cost per question shown here</text>
  </g>

  <!-- title -->
  <text x="870" y="96" font-size="34" font-weight="800" fill="url(#brand)">Paper Explainer</text>
  <text x="872" y="124" font-size="15" fill="#4c1d95">for Claude · Chrome extension</text>
</svg>
