<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper Explainer</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style>
  :root { color-scheme: light dark; --ink: #1e1b2e; --dim: #6b6785; --glass: rgba(255,255,255,.62); --edge: rgba(255,255,255,.9); --violet: #6d28d9; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ece9ff; --dim: #b9b4d6; --glass: rgba(30,27,46,.6); --edge: rgba(167,139,250,.3); --violet: #c4b5fd; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font: 14px/1.5 "Inter", "Segoe UI", system-ui, sans-serif; color: var(--ink);
         background: radial-gradient(circle at 15% 10%, #c4b5fd 0, transparent 40%), radial-gradient(circle at 90% 30%, #a5f3fc 0, transparent 45%),
                     radial-gradient(circle at 40% 95%, #fbcfe8 0, transparent 45%), #f5f3ff; background-attachment: fixed; }
  @media (prefers-color-scheme: dark) { body { background: radial-gradient(circle at 15% 10%, #4c1d95 0, transparent 40%), radial-gradient(circle at 90% 30%, #155e75 0, transparent 45%), radial-gradient(circle at 40% 95%, #831843 0, transparent 45%), #12101c; } }
  main { padding: 14px; display: grid; gap: 12px; }
  .glass { background: var(--glass); border: 1px solid var(--edge); border-radius: 18px; padding: 12px 14px; backdrop-filter: blur(18px) saturate(170%); box-shadow: 0 14px 34px -14px rgba(30,27,75,.35); }
  h1 { margin: 0; font-size: 15px; line-height: 1.35; }
  h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--violet); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .stat { text-align: center; padding: 8px 4px; border-radius: 12px; background: rgba(255,255,255,.35); }
  .stat b { display: block; font-size: 20px; background: linear-gradient(135deg, #7c3aed, #db2777); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat span { font-size: 11px; color: var(--dim); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li button { width: 100%; text-align: left; border: 1px solid transparent; background: rgba(255,255,255,.4); color: var(--ink); border-radius: 12px; padding: 8px 10px; cursor: pointer; font: inherit; overflow-x: auto; }
  li button:hover { border-color: rgba(139,92,246,.45); background: rgba(255,255,255,.7); }
  .num { font-weight: 700; color: var(--violet); margin-right: 6px; }
  .cap { color: var(--dim); font-size: 12.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.5); border: 1px solid rgba(139,92,246,.25); font-size: 12px; }
  .chip small { color: var(--dim); margin-left: 3px; }
  .primary { width: 100%; border: 0; border-radius: 14px; padding: 10px; font: 600 14px/1 "Inter", system-ui, sans-serif; color: white; cursor: pointer;
             background: linear-gradient(135deg, #7c3aed, #db2777); box-shadow: 0 10px 24px -8px rgba(124,58,237,.6); }
  .muted { color: var(--dim); font-size: 12.5px; }
  .cost { font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--dim); white-space: pre-line; }
  a { color: var(--violet); }
</style>
</head>
<body>
<main>
  <section class="glass" id="paper">
    <h2>This page</h2>
    <h1 id="title">Open a paper on arxiv.org/html, ar5iv or Wikipedia.</h1>
    <div class="stats">
      <div class="stat"><b id="n-eq">–</b><span>equations</span></div>
      <div class="stat"><b id="n-fig">–</b><span>figures &amp; tables</span></div>
      <div class="stat"><b id="n-sec">–</b><span>sections</span></div>
    </div>
  </section>
  <button class="primary" id="summary">✦ Summarize this paper</button>
  <section class="glass"><h2>Equations</h2><ul id="eqs"><li class="muted">none found yet</li></ul></section>
  <section class="glass"><h2>Figures and tables</h2><ul id="figs"><li class="muted">none found yet</li></ul></section>
  <section class="glass"><h2>Most used symbols</h2><div class="chips" id="symbols"></div></section>
  <section class="glass"><h2>This session</h2><div class="cost" id="cost">no questions yet</div>
    <p class="muted">Model, language and API key: <a href="#" id="options">options</a>.</p></section>
</main>
<script src="vendor/katex/katex.min.js"></script>
<script src="src/render.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
